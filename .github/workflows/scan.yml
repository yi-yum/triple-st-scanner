name: Triple ST Daily Scan

on:
  # 自動排程：週一到週五 美東時間收盤後 (21:30 UTC = 5:30 PM ET)
  schedule:
    - cron: '30 21 * * 1-5'

  # 手動觸發（在 GitHub 網頁上點 "Run workflow"）
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允許 commit & push 結果回 repo

    steps:
      # 1. 拉取 repo（包含上次的 entry_cache.json）
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 設定 Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. 快取 pip 套件（加速後續執行）
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      # 4. 安裝套件
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 5. 執行掃描
      - name: Run Triple ST Scanner
        run: python scanner.py
        env:
          PYTHONIOENCODING: utf-8

      # 6. 複製 HTML 到 docs/ (GitHub Pages 來源)
      - name: Copy dashboard to docs/
        run: |
          mkdir -p ../docs
          cp triple_st_dashboard.html ../docs/index.html

      # 7. Commit 並 push 結果（HTML + 更新的 entry_cache）
      - name: Commit and push results
        run: |
          cd ..
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html us-stock-scanner/entry_cache.json
          git diff --staged --quiet && echo "No changes to commit" || \
            git commit -m "scan: $(TZ='America/New_York' date '+%Y-%m-%d %H:%M ET')" && git push

    # 可選：把 HTML 也上傳為 Artifact（供下載備用）
      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: triple-st-dashboard
          path: triple_st_dashboard.html
          retention-days: 7
