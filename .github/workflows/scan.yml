name: Triple ST Daily Scan

on:
  schedule:
    # 掃描時間：週一~五
    # 21:30 UTC = 美東 17:30 (美股收盤後) = 台灣 05:30 (隔日)
    # 台股 13:30 TWN 收盤 = 05:30 UTC，美股與台股均已收盤
    - cron: '30 21 * * 1-5'
  workflow_dispatch:            # 允許手動觸發

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120        # 1y資料+新指標約需 50-60 分鐘
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        run: python scanner.py
        env:
          PYTHONIOENCODING: utf-8
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINMIND_TOKEN:  ${{ secrets.FINMIND_TOKEN }}

      - name: Copy result to docs/
        run: |
          mkdir -p docs
          cp triple_st_dashboard.html docs/index.html
          touch docs/.nojekyll

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add docs/index.html docs/.nojekyll entry_cache.json
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "scan: $(TZ='America/New_York' date '+%Y-%m-%d %H:%M ET')"
            git fetch origin
            git rebase origin/main
            git push origin HEAD:refs/heads/main
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: triple_st_dashboard.html
          retention-days: 7
