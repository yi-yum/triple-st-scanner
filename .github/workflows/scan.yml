name: Triple ST Daily Scan

on:
  schedule:
    - cron: '30 21 * * 1-5'   # 週一~五 21:30 UTC = 台灣時間 05:30 (收盤後)
  workflow_dispatch:            # 允許手動觸發

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        run: python scanner.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Copy result to docs/
        run: |
          mkdir -p docs
          cp triple_st_dashboard.html docs/index.html
          touch docs/.nojekyll

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add docs/index.html docs/.nojekyll entry_cache.json
          git diff --staged --quiet && echo "Nothing to commit" || (
            git commit -m "scan: $(TZ='America/New_York' date '+%Y-%m-%d %H:%M ET')" &&
            git push
          )

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: triple_st_dashboard.html
          retention-days: 7
